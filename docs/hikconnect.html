<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="robots" content="noindex" />
    <title>Opening Hik-Connect — Alley Cats Hotel</title>
  </head>
  <body>
    <p>
      Opening Hik-Connect…
      <a href="#" data-redirect-link>Continue</a>
    </p>
    <script>
      const mobileAppUrl = "https://appstore.hikvision.com/0yGe";
      const desktopUrl = "index.html";
      const userAgent = navigator.userAgent || "";
      const platform =
        navigator.userAgentData?.platform || navigator.platform || "";
      const isAndroid = /Android/i.test(userAgent);
      const isIOS =
        /iPhone|iPad|iPod/i.test(userAgent) ||
        (/Mac/i.test(platform) && navigator.maxTouchPoints > 1);
      const redirectUrl = isIOS || isAndroid ? mobileAppUrl : desktopUrl;

      document.querySelector("[data-redirect-link]").href = redirectUrl;
      window.location.replace(redirectUrl);
    </script>
  </body>
</html>
